<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 스마트 로드맵 엔진</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* ── 커스텀 애니메이션 ── */
    @keyframes spin        { to   { transform: rotate(360deg); } }
    @keyframes spinReverse { to   { transform: rotate(-360deg); } }
    @keyframes fadeIn      { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes dotPulse    { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }

    .spinner          { animation: spin        0.8s linear infinite; }
    .spinner-reverse  { animation: spinReverse 1.1s linear infinite; }
    .fade-in          { animation: fadeIn 0.3s ease forwards; }

    /* 스크롤바 숨김 */
    .no-scrollbar                  { -ms-overflow-style:none; scrollbar-width:none; }
    .no-scrollbar::-webkit-scrollbar { display:none; }

    /* 로딩 오버레이: hidden 속성 충돌 방지 — display:flex 보다 우선 */
    #loading-overlay[hidden] { display: none !important; }

    /* 그라데이션 버튼 */
    .btn-gradient {
      background: linear-gradient(135deg,#7c3aed,#2563eb);
      transition: all 0.2s;
    }
    .btn-gradient:hover {
      background: linear-gradient(135deg,#6d28d9,#1d4ed8);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(124,58,237,0.35);
    }
    .btn-gradient:active { transform: translateY(0); }

    /* 사이드바 아이템 */
    .sidebar-item {
      border-left: 2px solid transparent;
      transition: background 0.15s;
    }
    .sidebar-item:hover  { background: rgba(255,255,255,0.04); }
    .sidebar-item.is-active {
      background: rgba(124,58,237,0.12);
      border-left-color: #7c3aed;
    }

    /* 입력 필드 오류 강조 */
    .input-error {
      outline: 2px solid #ef4444 !important;
      outline-offset: 0 !important;
    }

    /* 진행률 바 트랜지션 */
    .progress-fill { transition: width 0.35s ease; }

    /* 체크박스 accent */
    input[type="checkbox"] { accent-color: #7c3aed; }

    /* 결과 카드 step 완료 취소선 */
    .step-done {
      text-decoration: line-through;
      opacity: 0.45;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- ────────────────────────────────────────────────
       로딩 오버레이 (기본 hidden)
  ──────────────────────────────────────────────── -->
  <div
    id="loading-overlay"
    hidden
    role="status"
    aria-live="assertive"
    aria-label="로드맵 연산 중"
    class="fixed inset-0 z-50 flex flex-col items-center justify-center gap-6"
    style="background:rgba(2,6,23,0.92); backdrop-filter:blur(8px);"
  >
    <!-- 이중 스피너 -->
    <div class="relative w-20 h-20 flex items-center justify-center" aria-hidden="true">
      <!-- 바깥 링: 보라색 -->
      <div class="absolute inset-0 rounded-full border-4 border-transparent border-t-purple-500 spinner"></div>
      <!-- 안쪽 링: 파란색 역방향 -->
      <div class="absolute inset-3 rounded-full border-4 border-transparent border-t-blue-500 spinner-reverse"></div>
      <!-- 중앙 점 -->
      <div class="w-2 h-2 rounded-full bg-purple-400" style="animation:dotPulse 1.2s ease-in-out infinite;"></div>
    </div>

    <p class="text-slate-300 text-sm text-center max-w-xs leading-relaxed px-4">
      알고리즘 매트릭스를 기반으로<br>최적의 로드맵을 연산 중입니다...
    </p>
  </div>

  <!-- ────────────────────────────────────────────────
       앱 레이아웃: 사이드바 + 메인
  ──────────────────────────────────────────────── -->
  <div class="flex flex-1 overflow-hidden" style="height:100vh;">

    <!-- ── 사이드바 ── -->
    <aside
      id="sidebar"
      class="w-64 flex-shrink-0 bg-slate-900 border-r border-slate-700/50 flex flex-col overflow-hidden"
      aria-label="저장된 로드맵 목록"
    >
      <!-- 사이드바 헤더 -->
      <div class="px-4 pt-5 pb-3 border-b border-slate-700/50">
        <div class="flex items-center gap-2">
          <div class="w-6 h-6 rounded bg-purple-600/30 flex items-center justify-center flex-shrink-0">
            <svg class="w-3.5 h-3.5 text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"/>
            </svg>
          </div>
          <span class="text-xs font-semibold text-slate-400 tracking-widest uppercase">로드맵 아카이브</span>
        </div>
      </div>

      <!-- 사이드바 목록 -->
      <ul
        id="sidebar-list"
        class="flex-1 overflow-y-auto no-scrollbar py-2"
        role="list"
        aria-label="저장된 로드맵"
      >
        <!-- JS로 채워짐 -->
      </ul>

      <!-- 사이드바 푸터: 저장 개수 -->
      <div class="px-4 py-3 border-t border-slate-700/50">
        <p id="sidebar-count" class="text-xs text-slate-500" aria-live="polite">0개 저장됨</p>
      </div>
    </aside>

    <!-- ── 메인 영역 ── -->
    <main class="flex-1 overflow-y-auto no-scrollbar bg-slate-950 p-6 md:p-8" aria-label="로드맵 생성 영역">

      <!-- 페이지 헤더 -->
      <header class="mb-8">
        <div class="flex items-center gap-3 mb-1">
          <!-- 그라데이션 아이콘 -->
          <div
            class="w-9 h-9 rounded-lg flex items-center justify-center flex-shrink-0"
            style="background:linear-gradient(135deg,#7c3aed,#2563eb);"
            aria-hidden="true"
          >
            <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
          <h1 class="text-xl font-bold text-slate-100 tracking-tight">스마트 로드맵 엔진</h1>
        </div>
        <p class="text-xs text-slate-500 pl-12">
          MatrixEngine 알고리즘이 카테고리를 분석하고 최적의 5단계 실행 계획을 즉시 생성합니다.
        </p>
      </header>

      <!-- 입력 카드 -->
      <section aria-labelledby="input-section-title">
        <h2 id="input-section-title" class="sr-only">로드맵 생성 입력</h2>
        <div class="bg-slate-900 border border-slate-700/50 rounded-xl p-5 mb-6">
          <div class="flex flex-col gap-4">

            <!-- 프로젝트 제목 -->
            <div>
              <label for="title-input" class="block text-xs font-medium text-slate-400 mb-1.5">
                프로젝트 제목
              </label>
              <input
                id="title-input"
                type="text"
                placeholder="예: 개인 포트폴리오 웹사이트 제작"
                maxlength="100"
                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100
                       placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500/40
                       transition-colors"
                aria-required="true"
                aria-describedby="title-error"
              >
              <p id="title-error" class="text-xs text-red-400 mt-1 hidden" role="alert">제목을 입력해 주세요.</p>
            </div>

            <!-- 카테고리 선택 -->
            <div>
              <label for="category-select" class="block text-xs font-medium text-slate-400 mb-1.5">
                카테고리
              </label>
              <select
                id="category-select"
                class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2.5 text-sm text-slate-100
                       focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500/40
                       transition-colors appearance-none cursor-pointer"
                aria-label="프로젝트 카테고리 선택"
              >
                <option value="IT/개발">IT / 개발</option>
                <option value="자산관리">자산관리</option>
                <option value="루틴/헬스">루틴 / 헬스</option>
                <option value="마케팅">마케팅</option>
              </select>
            </div>

            <!-- 생성 버튼 -->
            <button
              id="generate-btn"
              type="button"
              class="btn-gradient w-full rounded-lg py-2.5 text-sm font-semibold text-white flex items-center justify-center gap-2"
              aria-label="스마트 로드맵 생성"
            >
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
              </svg>
              스마트 로드맵 생성
            </button>
          </div>
        </div>
      </section>

      <!-- 결과 카드 (조건부 표시) -->
      <section id="result-section" hidden aria-labelledby="result-title" aria-live="polite">
        <div id="result-card" class="bg-slate-900 border border-slate-700/50 rounded-xl p-5 fade-in">
          <!-- JS로 채워짐 -->
        </div>
      </section>

    </main>
  </div>

  <!-- ────────────────────────────────────────────────
       MatrixEngine (인라인)
  ──────────────────────────────────────────────── -->
  <script>
const MatrixEngine = {
    templates: {
        "IT/개발": {
            summary: "성공적인 서비스 런칭을 위한 아키텍처 설계 및 에이전트 협업 개발 로드맵",
            steps: ["요구사항 정의 및 기획서(PRD) 작성하기","UI/UX 와이어프레임 설계 및 컴포넌트 뼈대 구축하기","핵심 비즈니스 로직 및 로컬 데이터 파이프라인 연동하기","QA 에이전트 시나리오 기반 예외 처리 및 통합 테스트 진행하기","Vercel 플랫폼을 활용한 프로덕션 빌드 및 최종 배포하기"]
        },
        "자산관리": {
            summary: "안정적인 자산 증식과 포트폴리오 최적화를 위한 자본 배분 가이드라인",
            steps: ["현재 총 자산 및 유동 자산 규모 정확히 측정하기","안전 자산(예금/채권)과 위험 자산(주식/ETF) 최적 비중 설정하기","월 현금흐름(이자 및 배당 수입) 극대화를 위한 종목 스크리닝하기","세금 혜택 및 연말정산 공제 상품 연계안 검토하기","정기적인 리밸런싱 주기 설정 및 모니터링 대시보드 구축하기"]
        },
        "루틴/헬스": {
            summary: "지속 가능한 신체 기능 발달 및 완벽한 피지컬 컨디셔닝을 위한 계획",
            steps: ["현재 인바디 데이터 측정 및 명확한 근골격량/체지방률 목표 설정하기","부위별 분할 운동 프로그램 및 주간 루틴 스케줄링하기","기초대사량 기준 탄단지(탄수화물/단백질/지방) 매크로 식단 설계하기","운동 수행 능력 점검 및 세트별 중량 점진적 과부하 기록하기","충분한 휴식 및 컨디션 회복을 위한 서플리먼트 타이밍 배치하기"]
        },
        "마케팅": {
            summary: "타겟 고객 유입 및 브랜드 인지도 극대화를 위한 그로스해킹 캠페인",
            steps: ["시장 조사 및 핵심 페르소나(Target Customer) 정의하기","캠페인 핵심 메시지 슬로건 및 크리에이티브 콘텐츠 제작하기","소셜 미디어 및 광고 매체별 예산 배분 및 미디어믹스 짜기","전환율(CVR) 추적을 위한 데이터 분석 픽셀 및 링크 심기","초기 성과 지표(KPI) 모니터링 후 광고 효율 최적화 피드백 반영하기"]
        }
    },
    generateLocalPlan(title, category) {
        const template = this.templates[category] || this.templates["IT/개발"];
        return {
            category,
            summary: `[${title}] 프로젝트 수립 완료: ${template.summary}`,
            action_steps: template.steps.map((task, i) => ({ step: i+1, task: `[${title}] ${task}`, completed: false }))
        };
    }
};
window.MatrixEngine = MatrixEngine;
  </script>

  <!-- ────────────────────────────────────────────────
       앱 로직
  ──────────────────────────────────────────────── -->
  <script>
// ============================================================
// AI 스마트 로드맵 엔진 — 메인 앱 스크립트
// LocalStorage 기반, 외부 API 없이 100% 로컬 동작
// ============================================================

const STORAGE_KEY = 'roadmap_plans';

// ── 허용된 카테고리 화이트리스트 (TC-03: 미등록 카테고리 차단) ──
const VALID_CATEGORIES = ['IT/개발', '자산관리', '루틴/헬스', '마케팅'];

// ── 카테고리 배지 스타일 매핑 ──
const BADGE_STYLES = {
  'IT/개발':   'bg-blue-500/20 text-blue-300 border border-blue-500/30',
  '자산관리':  'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30',
  '루틴/헬스': 'bg-orange-500/20 text-orange-300 border border-orange-500/30',
  '마케팅':    'bg-pink-500/20 text-pink-300 border border-pink-500/30',
};

// ── XSS 방지: 사용자 입력은 반드시 이 함수로 이스케이프 ──
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ── LocalStorage 헬퍼 ──
function loadPlans() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch {
    return [];
  }
}

function savePlans(plans) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(plans));
  } catch (e) {
    if (e.name === 'QuotaExceededError') {
      showToast('저장 공간이 부족합니다. 오래된 로드맵을 삭제해 주세요.');
    }
  }
}

// ── 현재 화면에 표시된 plan의 ID ──
let currentPlanId = null;

// ────────────────────────────────────────────────
// 사이드바 렌더링
// ────────────────────────────────────────────────
function renderSidebar() {
  const plans = loadPlans();
  const listEl = document.getElementById('sidebar-list');
  const countEl = document.getElementById('sidebar-count');

  countEl.textContent = `${plans.length}개 저장됨`;
  listEl.innerHTML = '';

  if (plans.length === 0) {
    // Empty state
    const empty = document.createElement('li');
    empty.className = 'px-4 py-8 text-center';
    empty.innerHTML = `
      <div class="flex flex-col items-center gap-2">
        <svg class="w-8 h-8 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
            d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h4a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        </svg>
        <p class="text-xs text-slate-600">저장된 로드맵 없음</p>
      </div>
    `;
    listEl.appendChild(empty);
    return;
  }

  // 최신순 정렬 (createdAt DESC)
  const sorted = [...plans].sort((a, b) => b.createdAt.localeCompare(a.createdAt));

  for (const plan of sorted) {
    const li = buildSidebarItem(plan);
    listEl.appendChild(li);
  }
}

function buildSidebarItem(plan) {
  const isActive = plan.id === currentPlanId;
  const total    = plan.action_steps.length;
  const done     = plan.action_steps.filter(s => s.completed).length;
  const pct      = total === 0 ? 0 : Math.round((done / total) * 100);

  const li = document.createElement('li');
  li.className = `sidebar-item group relative px-3.5 py-3 cursor-pointer${isActive ? ' is-active' : ''}`;
  li.setAttribute('role', 'button');
  li.setAttribute('tabindex', '0');
  li.setAttribute('aria-label', `${escapeHtml(plan.title)} 로드맵 보기`);
  li.dataset.planId = plan.id;

  li.innerHTML = `
    <div class="flex items-start justify-between gap-1 min-w-0">
      <span class="text-xs font-medium text-slate-200 truncate flex-1 min-w-0 leading-snug">
        ${escapeHtml(plan.title)}
      </span>
      <!-- 삭제 버튼: hover 시에만 표시 -->
      <button
        class="delete-btn flex-shrink-0 w-4 h-4 rounded flex items-center justify-center
               opacity-0 group-hover:opacity-100 transition-opacity text-slate-500 hover:text-red-400"
        data-plan-id="${escapeHtml(plan.id)}"
        aria-label="${escapeHtml(plan.title)} 삭제"
        tabindex="-1"
        type="button"
      >
        <svg class="w-3 h-3 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- 카테고리 배지 -->
    <span class="inline-block mt-1 text-[10px] px-1.5 py-0.5 rounded-full border ${BADGE_STYLES[plan.category] || 'bg-slate-700 text-slate-400 border-slate-600'}">
      ${escapeHtml(plan.category)}
    </span>

    <!-- 진행률 바 -->
    <div class="mt-2">
      <div class="h-1 bg-slate-700 rounded-full overflow-hidden" role="progressbar"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"
           aria-label="${escapeHtml(plan.title)} 진행률 ${done}/${total}">
        <div class="h-full rounded-full progress-fill"
             style="width:${pct}%; background:linear-gradient(90deg,#7c3aed,#2563eb);"></div>
      </div>
      <p class="text-[10px] text-slate-500 mt-0.5">${done} / ${total}</p>
    </div>
  `;

  // 클릭: 로드맵 로드
  li.addEventListener('click', (e) => {
    // 삭제 버튼 클릭이면 무시 (이벤트 위임으로 처리됨)
    if (e.target.closest('.delete-btn')) return;
    loadAndShowPlan(plan.id);
  });

  // 키보드 접근성
  li.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      loadAndShowPlan(plan.id);
    }
  });

  // 삭제 버튼
  const deleteBtn = li.querySelector('.delete-btn');
  deleteBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    deletePlan(plan.id);
  });

  return li;
}

// ────────────────────────────────────────────────
// 결과 카드 렌더링
// ────────────────────────────────────────────────
function renderResultCard(plan) {
  const section  = document.getElementById('result-section');
  const cardEl   = document.getElementById('result-card');
  const badgeCls = BADGE_STYLES[plan.category] || 'bg-slate-700 text-slate-400 border-slate-600';

  // fade-in 재시작을 위해 클래스 잠시 제거 후 재추가
  cardEl.classList.remove('fade-in');
  void cardEl.offsetWidth; // reflow
  cardEl.classList.add('fade-in');

  // 완료된 step 수 계산
  const total = plan.action_steps.length;
  const done  = plan.action_steps.filter(s => s.completed).length;
  const pct   = total === 0 ? 0 : Math.round((done / total) * 100);

  // 헤더 HTML (XSS 안전 처리)
  cardEl.innerHTML = `
    <!-- 카드 헤더 -->
    <div class="flex items-start justify-between gap-3 mb-4">
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-2 flex-wrap mb-1">
          <span class="inline-block text-xs px-2 py-0.5 rounded-full border font-medium ${badgeCls}">
            ${escapeHtml(plan.category)}
          </span>
        </div>
        <h2 id="result-title" class="text-sm font-semibold text-slate-100 leading-snug">
          ${escapeHtml(plan.title)}
        </h2>
        <p class="text-xs text-slate-400 mt-1 leading-relaxed">
          ${escapeHtml(plan.summary)}
        </p>
      </div>
    </div>

    <!-- 진행률 -->
    <div class="mb-5">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-[11px] font-medium text-slate-400">실행 진행률</span>
        <span class="text-[11px] text-slate-400">${done} / ${total} 완료</span>
      </div>
      <div class="h-1.5 bg-slate-700 rounded-full overflow-hidden"
           role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"
           aria-label="실행 계획 진행률">
        <div id="result-progress-bar" class="h-full rounded-full progress-fill"
             style="width:${pct}%; background:linear-gradient(90deg,#7c3aed,#2563eb);"></div>
      </div>
    </div>

    <!-- 구분선 -->
    <hr class="border-slate-700/60 mb-4">

    <!-- 단계 체크리스트 -->
    <ul id="steps-list" class="flex flex-col gap-2.5" role="list" aria-label="실행 단계 목록">
      <!-- JS로 채워짐 -->
    </ul>
  `;

  // step 아이템 렌더링
  const stepsList = cardEl.querySelector('#steps-list');
  for (let i = 0; i < plan.action_steps.length; i++) {
    stepsList.appendChild(buildStepItem(plan, i));
  }

  // 결과 섹션 표시
  section.hidden = false;
}

function buildStepItem(plan, idx) {
  const step      = plan.action_steps[idx];
  const isDone    = step.completed;
  const li        = document.createElement('li');
  li.className    = 'flex items-start gap-3 group';
  li.dataset.stepIdx = idx;

  li.innerHTML = `
    <!-- 번호 배지 -->
    <div class="flex-shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold text-white mt-0.5"
         style="background:linear-gradient(135deg,#7c3aed,#2563eb);" aria-hidden="true">
      ${step.step}
    </div>

    <!-- 텍스트 -->
    <span class="flex-1 text-sm text-slate-300 leading-relaxed step-text${isDone ? ' step-done' : ''}">
      ${escapeHtml(step.task)}
    </span>

    <!-- 체크박스 -->
    <input
      type="checkbox"
      ${isDone ? 'checked' : ''}
      class="flex-shrink-0 mt-1 w-4 h-4 cursor-pointer rounded"
      aria-label="단계 ${step.step} 완료 여부"
    >
  `;

  // 체크박스 이벤트 (클로저로 idx 캡처)
  const cb = li.querySelector('input[type="checkbox"]');
  cb.addEventListener('change', (function(capturedIdx) {
    return function() {
      toggleStep(plan.id, capturedIdx);
    };
  })(idx));

  return li;
}

// ────────────────────────────────────────────────
// 핵심 로직: 생성 / 토글 / 삭제 / 로드
// ────────────────────────────────────────────────

function handleGenerate() {
  const titleInput = document.getElementById('title-input');
  const categorySelect = document.getElementById('category-select');
  const titleError = document.getElementById('title-error');
  const title    = titleInput.value.trim();
  // 카테고리 화이트리스트 검증 (VALID_CATEGORIES에 없으면 기본값으로 fallback)
  const rawCategory = categorySelect.value;
  const category = VALID_CATEGORIES.includes(rawCategory) ? rawCategory : 'IT/개발';

  // 유효성 검사
  if (!title) {
    titleInput.classList.add('input-error');
    titleError.classList.remove('hidden');
    titleInput.focus();
    // 입력 시 오류 상태 해제
    titleInput.addEventListener('input', function clearError() {
      titleInput.classList.remove('input-error');
      titleError.classList.add('hidden');
      titleInput.removeEventListener('input', clearError);
    });
    return;
  }

  // 오류 상태 클리어
  titleInput.classList.remove('input-error');
  titleError.classList.add('hidden');

  // 로딩 오버레이 표시
  const overlay = document.getElementById('loading-overlay');
  overlay.hidden = false;

  // 500ms 후 결과 렌더링
  setTimeout(() => {
    // 오버레이 숨김
    overlay.hidden = true;

    // 플랜 생성
    const plan = window.MatrixEngine.generateLocalPlan(title, category);

    // 저장 객체 구성
    const entry = {
      id:           Date.now().toString(),
      title:        title,
      category:     plan.category,
      summary:      plan.summary,
      action_steps: plan.action_steps,
      createdAt:    new Date().toISOString(),
    };

    // LocalStorage 저장
    const plans = loadPlans();
    plans.push(entry);
    savePlans(plans);

    // 현재 표시 plan 업데이트
    currentPlanId = entry.id;

    // UI 갱신
    renderResultCard(entry);
    renderSidebar();

    // 입력 초기화
    titleInput.value = '';

  }, 500);
}

function toggleStep(planId, stepIdx) {
  const plans = loadPlans();
  const plan  = plans.find(p => p.id === planId);
  if (!plan || !plan.action_steps[stepIdx]) return;

  plan.action_steps[stepIdx].completed = !plan.action_steps[stepIdx].completed;
  savePlans(plans);

  // DOM 직접 조작 — 전체 re-render 없이 취소선 토글
  const stepsListEl = document.getElementById('steps-list');
  if (!stepsListEl) return;

  const stepLi   = stepsListEl.querySelector(`[data-step-idx="${stepIdx}"]`);
  if (!stepLi) return;

  const textEl = stepLi.querySelector('.step-text');
  if (textEl) {
    textEl.classList.toggle('step-done', plan.action_steps[stepIdx].completed);
  }

  // 결과 카드 진행률 바 갱신
  const total = plan.action_steps.length;
  const done  = plan.action_steps.filter(s => s.completed).length;
  const pct   = total === 0 ? 0 : Math.round((done / total) * 100);

  const progressBar = document.getElementById('result-progress-bar');
  if (progressBar) {
    progressBar.style.width = pct + '%';
    progressBar.closest('[role="progressbar"]').setAttribute('aria-valuenow', pct);
  }

  // 사이드바 진행률 바만 갱신 (re-render 없이)
  const sidebarItem = document.querySelector(`[data-plan-id="${planId}"]`);
  if (sidebarItem) {
    const sidebarBar = sidebarItem.querySelector('[role="progressbar"] div');
    if (sidebarBar) {
      sidebarBar.style.width = pct + '%';
      sidebarItem.querySelector('[role="progressbar"]').setAttribute('aria-valuenow', pct);
    }
    const sidebarCount = sidebarItem.querySelector('p.text-\\[10px\\]');
    if (sidebarCount) sidebarCount.textContent = `${done} / ${total}`;
  }
}

function deletePlan(planId) {
  const plans = loadPlans().filter(p => p.id !== planId);
  savePlans(plans);

  // 현재 표시 중인 plan이 삭제되면 결과 카드도 숨김
  if (currentPlanId === planId) {
    currentPlanId = null;
    document.getElementById('result-section').hidden = true;
  }

  renderSidebar();
}

function loadAndShowPlan(planId) {
  const plans = loadPlans();
  const plan  = plans.find(p => p.id === planId);
  if (!plan) return;

  currentPlanId = planId;
  renderResultCard(plan);
  renderSidebar(); // active 스타일 동기화
}

// ────────────────────────────────────────────────
// 토스트 메시지 (접근성: aria-live)
// ────────────────────────────────────────────────
function showToast(message) {
  let toast = document.getElementById('toast-msg');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'toast-msg';
    toast.setAttribute('role', 'alert');
    toast.setAttribute('aria-live', 'assertive');
    toast.className = [
      'fixed bottom-6 left-1/2 -translate-x-1/2 z-40',
      'bg-slate-800 border border-slate-700 text-slate-200 text-sm px-4 py-2.5 rounded-lg shadow-xl',
      'transition-opacity duration-300',
    ].join(' ');
    document.body.appendChild(toast);
  }
  toast.textContent = message;
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 3000);
}

// ────────────────────────────────────────────────
// 초기화
// ────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  // 생성 버튼 이벤트
  document.getElementById('generate-btn').addEventListener('click', handleGenerate);

  // Enter 키로도 생성 가능
  document.getElementById('title-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleGenerate();
  });

  // 사이드바 초기 렌더
  renderSidebar();

  // 가장 최근 plan 자동 로드
  const plans = loadPlans();
  if (plans.length > 0) {
    const latest = plans.sort((a, b) => b.createdAt.localeCompare(a.createdAt))[0];
    loadAndShowPlan(latest.id);
  }
});
  </script>
</body>
