<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나의 할 일</title>
    <style>
/* ---------- 기본 ---------- */

* {
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: #f5f5f7;
    color: #222;
    margin: 0;
    padding: 2rem 1rem;
}

.app {
    max-width: 600px;
    margin: 0 auto;
    background: #fff;
    padding: 1.5rem;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
}

.app-header h1 {
    margin: 0 0 1rem;
    font-size: 1.4rem;
}

/* ---------- 진행률 ---------- */

.progress-section {
    margin-bottom: 1.25rem;
}

.progress-bar {
    background: #ececec;
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
}

.progress-bar-fill {
    background: #4caf50;
    height: 100%;
    width: 0%;
    transition: width 0.2s ease;
}

.progress-text {
    margin: 0.5rem 0 0;
    font-size: 0.85rem;
    color: #666;
}

/* ---------- 입력 / 필터 / 공통 폼 ---------- */

input[type="text"],
select,
button {
    padding: 0.5rem 0.75rem;
    font-size: 0.95rem;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #fff;
    font-family: inherit;
}

button {
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

button:hover {
    background: #f0f0f0;
}

.input-section {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
}

.input-section input[type="text"] {
    flex: 1;
    min-width: 0;
}

.auto-hint {
    flex: 1 1 100%;
    margin: 0;
    font-size: 0.8rem;
    color: #2196f3;
}

#add-button {
    background: #2196f3;
    color: #fff;
    border-color: #2196f3;
}

#add-button:hover {
    background: #1976d2;
    border-color: #1976d2;
}

.filter-section {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
}

.filter-button.active {
    background: #2196f3;
    border-color: #2196f3;
    color: #fff;
}

.filter-button.active:hover {
    background: #1976d2;
    border-color: #1976d2;
}

/* ---------- 할 일 목록 ---------- */

#todo-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

/* 기본 todo-item: 세로 방향(column)으로 변경하여 AI 플랜 섹션을 하단에 배치 */
.todo-item {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
    padding: 0.6rem 0.25rem;
    border-bottom: 1px solid #eee;
}

.todo-item:last-child {
    border-bottom: none;
}

/* 체크박스/라벨/텍스트/버튼을 하나의 가로 행으로 묶는 컨테이너 */
.todo-main-row {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
}

/* 편집 모드에서는 기존 가로 레이아웃 복원 */
.todo-item.editing {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.4rem;
}

.category-label {
    padding: 0.15rem 0.5rem;
    border-radius: 4px;
    font-size: 0.75rem;
    white-space: nowrap;
}

.category-work {
    background: #e3f2fd;
    color: #1565c0;
}

.category-personal {
    background: #e8f5e9;
    color: #2e7d32;
}

.category-study {
    background: #fff3e0;
    color: #e65100;
}

.todo-text {
    flex: 1;
    word-break: break-word;
    min-width: 0;
}

.todo-text.completed {
    text-decoration: line-through;
    color: #aaa;
}

.delete-button:hover {
    background: #ffebee;
    border-color: #f44336;
    color: #f44336;
}

.edit-button:hover {
    background: #e3f2fd;
    border-color: #2196f3;
    color: #1976d2;
}

/* ---------- AI 플랜 버튼 ---------- */

.ai-plan-button {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    white-space: nowrap;
    font-size: 0.85rem;
    padding: 0.4rem 0.65rem;
    border-radius: 6px;
    transition: opacity 0.15s ease, transform 0.1s ease;
}

.ai-plan-button:hover {
    background: linear-gradient(135deg, #667eea, #764ba2);
    opacity: 0.88;
    transform: translateY(-1px);
}

.ai-plan-button:active {
    transform: translateY(0);
}

/* ---------- AI 플랜 섹션 ---------- */

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
}

.ai-plan-section {
    background: linear-gradient(135deg, #f8f4ff, #f0f4ff);
    border: 1px solid #e0d9ff;
    border-radius: 8px;
    padding: 0.75rem 1rem;
    animation: fadeIn 0.25s ease forwards;
    width: 100%;
}

/* AI 플랜 헤더: 카테고리 태그 + 요약 */
.ai-plan-header {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 0.65rem;
    flex-wrap: wrap;
}

.ai-category-tag {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 0.72rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    white-space: nowrap;
    font-weight: 600;
}

.ai-summary {
    font-size: 0.82rem;
    color: #5a4e72;
    font-style: italic;
    flex: 1;
    min-width: 0;
    word-break: break-word;
}

/* AI 플랜 체크리스트 */
.ai-steps-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
}

.ai-step-item {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
}

.ai-step-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.3rem;
    height: 1.3rem;
    min-width: 1.3rem;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    font-size: 0.68rem;
    font-weight: 700;
    border-radius: 50%;
    margin-top: 0.05rem;
}

.ai-step-text {
    font-size: 0.83rem;
    color: #3d3050;
    flex: 1;
    word-break: break-word;
    line-height: 1.4;
}

.ai-step-text.step-done {
    text-decoration: line-through;
    color: #a89dc0;
}

.ai-step-checkbox {
    margin-top: 0.1rem;
    accent-color: #764ba2;
    width: 0.95rem;
    height: 0.95rem;
    flex-shrink: 0;
    cursor: pointer;
}

/* ---------- 인라인 편집 ---------- */

.edit-input {
    flex: 1;
    min-width: 0;
}

/* ---------- 빈 상태 ---------- */

.empty-state {
    text-align: center;
    color: #999;
    padding: 2rem 1rem;
    font-size: 0.95rem;
    border-bottom: none;
}

/* ---------- AI 로딩 오버레이 ---------- */

@keyframes spin {
    to { transform: rotate(360deg); }
}

#ai-loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.1rem;
    z-index: 9999;
}
#ai-loading-overlay[hidden] {
    display: none;
}

#ai-loading-overlay .spinner {
    width: 48px;
    height: 48px;
    border: 4px solid rgba(255, 255, 255, 0.25);
    border-top-color: #2196f3;
    border-radius: 50%;
    animation: spin 0.75s linear infinite;
}

#ai-loading-overlay .loading-text {
    color: #fff;
    font-size: 0.95rem;
    font-weight: 500;
    text-align: center;
    max-width: 280px;
    line-height: 1.5;
    letter-spacing: 0.01em;
}

/* ---------- 반응형 (<=480px) ---------- */

@media (max-width: 480px) {
    body {
        padding: 1rem 0.5rem;
    }

    .app {
        padding: 1rem;
        border-radius: 8px;
    }

    .app-header h1 {
        font-size: 1.2rem;
    }

    .input-section input[type="text"] {
        flex: 1 1 100%;
    }

    .input-section select,
    .input-section #add-button {
        flex: 1;
    }

    .filter-button {
        flex: 1 1 calc(50% - 0.25rem);
        text-align: center;
    }

    /* 모바일에서도 todo-item은 column 유지, main-row 내부 줄바꿈 허용 */
    .todo-main-row {
        flex-wrap: wrap;
    }

    .todo-text {
        flex: 1 1 100%;
        order: 10;
    }

    .ai-plan-button {
        order: 11;
    }
}
    </style>
</head>
<body>

    <!-- AI 로딩 오버레이: 기본 hidden, generateAIPlan 중에만 표시 -->
    <div id="ai-loading-overlay" hidden aria-live="assertive" role="status" aria-label="AI 실행 계획 생성 중">
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-text">AI가 프로젝트 실행 계획을 보안 채널을 통해 생성 중입니다...</p>
    </div>

    <div class="app">
        <header class="app-header">
            <h1>📋 나의 할 일</h1>
        </header>

        <section class="progress-section">
            <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
            </div>
            <p class="progress-text" id="progress-text">0 / 0 완료 (0%)</p>
        </section>

        <section class="input-section">
            <input type="text" id="todo-input" placeholder="할 일을 입력하세요" aria-label="새 할 일 입력">
            <select id="category-select" aria-label="카테고리 선택">
                <option value="auto">자동</option>
                <option value="work">업무</option>
                <option value="personal">개인</option>
                <option value="study">공부</option>
            </select>
            <button type="button" id="add-button">추가</button>
            <p class="auto-hint" id="auto-hint" hidden aria-live="polite"></p>
        </section>

        <section class="filter-section" aria-label="카테고리 필터">
            <button type="button" class="filter-button" data-filter="all">전체</button>
            <button type="button" class="filter-button" data-filter="work">업무</button>
            <button type="button" class="filter-button" data-filter="personal">개인</button>
            <button type="button" class="filter-button" data-filter="study">공부</button>
        </section>

        <section class="list-section">
            <ul id="todo-list" aria-label="할 일 목록"></ul>
        </section>
    </div>

    <script>
// ============================================================
// app.js — 할 일 관리 앱: 데이터 / 렌더링 / 이벤트 / 초기화
// AI 플랜 생성, 체크리스트 저장 로직 포함
// ============================================================

// ---------- 상수 & 상태 ----------

const STORAGE_KEY = "todos";

const CATEGORY_LABELS = {
    work: "업무",
    personal: "개인",
    study: "공부",
};

// 자동 분류용 키워드 — 텍스트에 포함된 키워드 수가 가장 많은 카테고리로 분류한다.
const CATEGORY_KEYWORDS = {
    work: [
        "회의", "미팅", "보고서", "보고", "이메일", "메일", "발표", "프로젝트",
        "클라이언트", "고객", "업무", "출장", "결재", "기획", "마감", "회사",
        "팀", "거래처", "계약",
    ],
    study: [
        "공부", "강의", "수업", "시험", "과제", "숙제", "학습", "독서", "책",
        "영어", "수학", "국어", "인강", "복습", "예습", "학원", "자격증",
        "토익", "토플", "코딩", "논문",
    ],
    personal: [
        "운동", "헬스", "요가", "산책", "조깅", "쇼핑", "장보기", "약속", "친구",
        "가족", "영화", "여행", "식사", "점심", "저녁", "아침", "병원", "청소",
        "빨래", "은행", "미용실",
    ],
};

// 자동 분류에서 매칭이 전혀 없을 때 사용할 기본 카테고리.
const AUTO_FALLBACK_CATEGORY = "personal";

let currentFilter = "all";

// DOM 참조 — DOMContentLoaded에서 채워진다.
let todoListEl;
let todoInputEl;
let categorySelectEl;
let addButtonEl;
let progressBarFillEl;
let progressTextEl;
let filterButtonEls;
let autoHintEl;
let aiLoadingOverlayEl;

// ---------- 자동 카테고리 분류 ----------

// 텍스트를 카테고리별 키워드와 매칭해 가장 점수가 높은 카테고리를 반환한다.
// 매칭이 없으면 AUTO_FALLBACK_CATEGORY를 반환한다.
function classifyByKeywords(text) {
    if (!text) return AUTO_FALLBACK_CATEGORY;
    const lower = text.toLowerCase();
    let best = AUTO_FALLBACK_CATEGORY;
    let bestScore = 0;
    for (const [category, keywords] of Object.entries(CATEGORY_KEYWORDS)) {
        let score = 0;
        for (const kw of keywords) {
            if (lower.includes(kw.toLowerCase())) score++;
        }
        if (score > bestScore) {
            bestScore = score;
            best = category;
        }
    }
    return best;
}

// 셀렉트가 "auto"면 키워드 분류 결과로 치환, 아니면 원래 값 그대로 사용한다.
function resolveCategory(selectValue, text) {
    return selectValue === "auto" ? classifyByKeywords(text) : selectValue;
}

// ---------- 데이터 계층 ----------

// localStorage에서 할 일 배열을 불러온다 (없으면 빈 배열 반환).
function loadTodos() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        return JSON.parse(raw);
    } catch {
        return [];
    }
}

// 주어진 배열을 localStorage에 JSON으로 저장한다.
// 저장 용량 초과 시 사용자에게 안내한다.
function saveTodos(todos) {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    } catch (e) {
        if (e.name === "QuotaExceededError") {
            alert("저장 공간이 부족합니다. 완료된 할 일을 일부 삭제해 주세요.");
        }
    }
}

// 새 할 일을 만들어 배열 끝에 추가하고 저장한다.
function addTodo(text, category) {
    const todos = loadTodos();
    const todo = {
        id: Date.now().toString(),
        text,
        category,
        completed: false,
        createdAt: new Date().toISOString(),
        // aiPlan 필드는 AI 플랜 생성 후 saveAIPlan()에서 추가된다.
    };
    todos.push(todo);
    saveTodos(todos);
    return todo;
}

// id로 찾은 할 일의 텍스트와 카테고리를 갱신한다.
function updateTodo(id, newText, newCategory) {
    const todos = loadTodos();
    const todo = todos.find((t) => t.id === id);
    if (!todo) return null;
    todo.text = newText;
    todo.category = newCategory;
    saveTodos(todos);
    return todo;
}

// id에 해당하는 할 일을 배열에서 제거한다.
function deleteTodo(id) {
    const todos = loadTodos();
    const next = todos.filter((t) => t.id !== id);
    saveTodos(next);
}

// id에 해당하는 할 일의 완료 여부를 뒤집는다.
function toggleTodo(id) {
    const todos = loadTodos();
    const todo = todos.find((t) => t.id === id);
    if (!todo) return null;
    todo.completed = !todo.completed;
    saveTodos(todos);
    return todo;
}

// AI 플랜 결과를 특정 할 일에 저장한다.
function saveAIPlan(todoId, aiPlan) {
    const todos = loadTodos();
    const todo = todos.find((t) => t.id === todoId);
    if (!todo) return;
    todo.aiPlan = aiPlan;
    saveTodos(todos);
}

// 특정 할 일의 AI 플랜 내 step 완료 여부를 토글하고 DOM을 직접 갱신한다.
// 전체 re-render 없이 해당 텍스트 요소에만 취소선을 적용한다.
function toggleStep(todoId, stepIndex) {
    const todos = loadTodos();
    const todo = todos.find((t) => t.id === todoId);
    if (!todo || !todo.aiPlan) return;

    const step = todo.aiPlan.action_steps[stepIndex];
    if (!step) return;
    step.completed = !step.completed;
    saveTodos(todos);

    // DOM 직접 조작: 해당 step 텍스트에 취소선 스타일만 토글
    const stepTextEl = document.querySelector(
        `[data-todo-id="${todoId}"] [data-step-index="${stepIndex}"] .ai-step-text`
    );
    if (stepTextEl) {
        stepTextEl.classList.toggle("step-done", step.completed);
    }
}

// ---------- AI 플랜 생성 ----------

// 로딩 오버레이 표시 / 숨김 헬퍼
function showLoadingOverlay() {
    aiLoadingOverlayEl.hidden = false;
}
function hideLoadingOverlay() {
    aiLoadingOverlayEl.hidden = true;
}

// AI 플랜 생성 비동기 함수
// POST /api/generate 로 idea 텍스트를 전송하고 응답을 LocalStorage에 저장한다.
async function generateAIPlan(todoId) {
    const todos = loadTodos();
    const todo = todos.find((t) => t.id === todoId);
    if (!todo) {
        console.warn("[AI플랜] ❌ todo를 찾을 수 없음:", todoId);
        return;
    }

    console.log("[AI플랜] ▶ 시작", { id: todoId, text: todo.text });

    const controller = new AbortController();
    const timeoutId = setTimeout(() => {
        controller.abort();
        console.error("[AI플랜] ⏱ 타임아웃 — 30초 초과로 요청 중단");
    }, 30000);

    try {
        showLoadingOverlay();
        console.log("[AI플랜] 🔒 로딩 오버레이 표시됨");
        console.log("[AI플랜] 📡 POST /api/generate 요청 전송...");

        const response = await fetch("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ idea: todo.text }),
            signal: controller.signal,
        });

        clearTimeout(timeoutId);
        console.log("[AI플랜] 📥 응답 수신:", response.status, response.statusText);

        if (!response.ok) {
            const errBody = await response.text().catch(() => "(본문 없음)");
            console.error("[AI플랜] ❌ 서버 오류 응답 본문:", errBody);
            throw new Error(`서버 오류 ${response.status} — ${errBody.slice(0, 200)}`);
        }

        const result = await response.json();
        console.log("[AI플랜] ✅ 응답 JSON:", result);

        const normalizedPlan = {
            category: result.category || "기타",
            summary: result.summary || "",
            action_steps: (result.action_steps || []).map((s, i) => ({
                step: s.step ?? i + 1,
                task: s.task ?? "",
                completed: false,
            })),
        };

        console.log("[AI플랜] 💾 저장할 플랜:", normalizedPlan);
        saveAIPlan(todoId, normalizedPlan);
        renderTodos();
        console.log("[AI플랜] ✔ 렌더링 완료");

    } catch (err) {
        clearTimeout(timeoutId);
        if (err.name === "AbortError") {
            console.error("[AI플랜] ⏱ AbortError — 요청이 타임아웃으로 중단됨");
            alert("AI 플랜 생성이 시간 초과됐습니다.\n잠시 후 다시 시도해 주세요.");
        } else {
            console.error("[AI플랜] ❌ 오류 종류:", err.name);
            console.error("[AI플랜] ❌ 오류 메시지:", err.message);
            console.error("[AI플랜] ❌ 스택:", err.stack);
            alert(`AI 플랜 생성에 실패했습니다.\n\n${err.message}`);
        }
    } finally {
        clearTimeout(timeoutId);
        hideLoadingOverlay();
        console.log("[AI플랜] 🔓 로딩 오버레이 닫힘");
    }
}

// ---------- 렌더링 ----------

// 현재 필터에 맞는 항목을 ul에 그리고, 빈 상태 안내와 진행률을 갱신한다.
function renderTodos() {
    const all = loadTodos();
    const visible = currentFilter === "all"
        ? all
        : all.filter((t) => t.category === currentFilter);

    todoListEl.innerHTML = "";

    if (all.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty-state";
        empty.textContent = "아직 할 일이 없어요. 위에서 추가해보세요!";
        todoListEl.appendChild(empty);
    } else {
        for (const todo of visible) {
            todoListEl.appendChild(buildTodoItem(todo));
        }
    }

    updateProgress();
}

// 단일 할 일에 대한 li 요소를 만든다.
// 구조: li.todo-item > .todo-main-row (기존 요소들 + AI 플랜 버튼) + .ai-plan-section (조건부)
function buildTodoItem(todo) {
    const li = document.createElement("li");
    li.className = "todo-item";
    li.dataset.id = todo.id;
    // toggleStep에서 data-todo-id로 해당 아이템을 찾기 위해 설정
    li.dataset.todoId = todo.id;

    // --- .todo-main-row: 기존 요소들을 가로 행으로 묶는 컨테이너 ---
    const mainRow = document.createElement("div");
    mainRow.className = "todo-main-row";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = todo.completed;
    checkbox.setAttribute("aria-label", `${todo.text} 완료 여부`);
    checkbox.addEventListener("change", () => {
        toggleTodo(todo.id);
        renderTodos();
    });

    const categoryEl = document.createElement("span");
    categoryEl.className = `category-label category-${todo.category}`;
    categoryEl.textContent = CATEGORY_LABELS[todo.category] ?? todo.category;

    const textEl = document.createElement("span");
    textEl.className = "todo-text";
    if (todo.completed) textEl.classList.add("completed");
    textEl.textContent = todo.text;

    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "edit-button";
    editBtn.textContent = "수정";
    editBtn.setAttribute("aria-label", `${todo.text} 수정`);
    editBtn.addEventListener("click", () => startEdit(li, todo));

    const deleteBtn = document.createElement("button");
    deleteBtn.type = "button";
    deleteBtn.className = "delete-button";
    deleteBtn.textContent = "삭제";
    deleteBtn.setAttribute("aria-label", `${todo.text} 삭제`);
    deleteBtn.addEventListener("click", () => {
        deleteTodo(todo.id);
        renderTodos();
    });

    // AI 플랜 버튼: 기존 플랜이 있으면 "재생성", 없으면 "AI 플랜"
    const aiPlanBtn = document.createElement("button");
    aiPlanBtn.type = "button";
    aiPlanBtn.className = "ai-plan-button";
    aiPlanBtn.textContent = todo.aiPlan ? "🔄 재생성" : "✨ AI 플랜";
    aiPlanBtn.setAttribute("aria-label", todo.aiPlan ? `${todo.text} AI 플랜 재생성` : `${todo.text} AI 플랜 생성`);
    aiPlanBtn.addEventListener("click", () => generateAIPlan(todo.id));

    mainRow.append(checkbox, categoryEl, textEl, editBtn, deleteBtn, aiPlanBtn);
    li.appendChild(mainRow);

    // AI 플랜 섹션: aiPlan이 있을 때만 렌더링
    if (todo.aiPlan) {
        li.appendChild(buildAIPlanSection(todo));
    }

    return li;
}

// AI 플랜 섹션 DOM 빌더
function buildAIPlanSection(todo) {
    const plan = todo.aiPlan;

    const section = document.createElement("div");
    section.className = "ai-plan-section";
    section.setAttribute("aria-label", "AI 실행 계획");

    // 헤더: AI 카테고리 태그 + 요약
    const header = document.createElement("div");
    header.className = "ai-plan-header";

    const categoryTag = document.createElement("span");
    categoryTag.className = "ai-category-tag";
    categoryTag.textContent = plan.category;

    const summary = document.createElement("span");
    summary.className = "ai-summary";
    summary.textContent = plan.summary;

    header.append(categoryTag, summary);

    // 체크리스트
    const stepsList = document.createElement("ul");
    stepsList.className = "ai-steps-list";
    stepsList.setAttribute("role", "list");

    for (let i = 0; i < plan.action_steps.length; i++) {
        const stepData = plan.action_steps[i];
        const stepItem = document.createElement("li");
        stepItem.className = "ai-step-item";
        // toggleStep에서 data-step-index로 해당 step을 찾기 위해 설정
        stepItem.dataset.stepIndex = i;

        const badge = document.createElement("span");
        badge.className = "ai-step-badge";
        badge.textContent = stepData.step;
        badge.setAttribute("aria-hidden", "true");

        const stepText = document.createElement("span");
        stepText.className = "ai-step-text";
        if (stepData.completed) stepText.classList.add("step-done");
        stepText.textContent = stepData.task;

        const stepCheckbox = document.createElement("input");
        stepCheckbox.type = "checkbox";
        stepCheckbox.className = "ai-step-checkbox";
        stepCheckbox.checked = stepData.completed;
        stepCheckbox.setAttribute("aria-label", `단계 ${stepData.step}: ${stepData.task}`);
        // 클로저로 todoId와 stepIndex를 캡처
        stepCheckbox.addEventListener("change", (function(tid, idx) {
            return function() { toggleStep(tid, idx); };
        })(todo.id, i));

        stepItem.append(badge, stepText, stepCheckbox);
        stepsList.appendChild(stepItem);
    }

    section.append(header, stepsList);
    return section;
}

// 전체 기준(필터 무관) 완료 비율로 프로그레스 바와 텍스트를 갱신한다.
function updateProgress() {
    const all = loadTodos();
    const total = all.length;
    const done = all.filter((t) => t.completed).length;
    const percent = total === 0 ? 0 : Math.round((done / total) * 100);
    progressBarFillEl.style.width = percent + "%";
    progressBarFillEl.closest("[role='progressbar']").setAttribute("aria-valuenow", percent);
    progressTextEl.textContent = `${done} / ${total} 완료 (${percent}%)`;
}

// 활성 필터를 바꾸고 버튼의 active 클래스를 동기화한 뒤 다시 그린다.
function setFilter(filter) {
    currentFilter = filter;
    for (const btn of filterButtonEls) {
        btn.classList.toggle("active", btn.dataset.filter === filter);
    }
    renderTodos();
}

// ---------- 이벤트 핸들러 ----------

// 입력값을 검사 후 새 할 일을 추가한다 (빈 문자열은 무시).
// "자동" 선택 시 키워드 기반으로 카테고리를 결정해 저장한다.
function handleAdd() {
    const text = todoInputEl.value.trim();
    if (!text) return;
    const category = resolveCategory(categorySelectEl.value, text);
    addTodo(text, category);
    todoInputEl.value = "";
    updateAutoHint();
    renderTodos();
}

// 입력 텍스트와 셀렉트 상태를 보고 자동 분류 미리보기 힌트를 갱신한다.
function updateAutoHint() {
    if (!autoHintEl) return;
    if (categorySelectEl.value !== "auto") {
        autoHintEl.hidden = true;
        return;
    }
    const text = todoInputEl.value.trim();
    if (!text) {
        autoHintEl.hidden = true;
        return;
    }
    const category = classifyByKeywords(text);
    autoHintEl.hidden = false;
    autoHintEl.textContent = `자동 분류: ${CATEGORY_LABELS[category]}`;
}

// 해당 li를 인라인 편집 UI로 교체하고 저장(Enter) / 취소(Esc) 동작을 연결한다.
// 편집 모드: li.todo-item.editing (flex-direction: row; flex-wrap: wrap) 으로 복원
function startEdit(li, todo) {
    li.innerHTML = "";
    li.classList.add("editing");

    const input = document.createElement("input");
    input.type = "text";
    input.className = "edit-input";
    input.value = todo.text;
    input.setAttribute("aria-label", "할 일 텍스트 편집");

    const select = document.createElement("select");
    select.className = "edit-category";
    select.setAttribute("aria-label", "카테고리 선택");
    const autoOpt = document.createElement("option");
    autoOpt.value = "auto";
    autoOpt.textContent = "자동";
    select.appendChild(autoOpt);
    for (const [value, label] of Object.entries(CATEGORY_LABELS)) {
        const opt = document.createElement("option");
        opt.value = value;
        opt.textContent = label;
        if (value === todo.category) opt.selected = true;
        select.appendChild(opt);
    }

    const saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.textContent = "저장";

    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.textContent = "취소";

    const commit = () => {
        const newText = input.value.trim();
        if (!newText) return;
        const newCategory = resolveCategory(select.value, newText);
        updateTodo(todo.id, newText, newCategory);
        renderTodos();
    };

    const cancel = () => renderTodos();

    saveBtn.addEventListener("click", commit);
    cancelBtn.addEventListener("click", cancel);
    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") commit();
        else if (e.key === "Escape") cancel();
    });

    li.append(input, select, saveBtn, cancelBtn);
    input.focus();
    input.select();
}

// ---------- 초기화 ----------

// 페이지 로드 시 DOM 참조를 채우고, 이벤트를 연결하고, 첫 렌더를 수행한다.
document.addEventListener("DOMContentLoaded", () => {
    todoListEl           = document.getElementById("todo-list");
    todoInputEl          = document.getElementById("todo-input");
    categorySelectEl     = document.getElementById("category-select");
    addButtonEl          = document.getElementById("add-button");
    progressBarFillEl    = document.getElementById("progress-bar-fill");
    progressTextEl       = document.getElementById("progress-text");
    filterButtonEls      = document.querySelectorAll(".filter-button");
    autoHintEl           = document.getElementById("auto-hint");
    aiLoadingOverlayEl   = document.getElementById("ai-loading-overlay");

    addButtonEl.addEventListener("click", handleAdd);
    todoInputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") handleAdd();
    });
    todoInputEl.addEventListener("input", updateAutoHint);
    categorySelectEl.addEventListener("change", updateAutoHint);
    updateAutoHint();

    for (const btn of filterButtonEls) {
        btn.addEventListener("click", () => setFilter(btn.dataset.filter));
    }

    setFilter(currentFilter);
});
    </script>
